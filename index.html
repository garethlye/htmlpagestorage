<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Data Input</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --primary: #EA449A;
            --primary-hover: #d03583;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: min(625px, 92vw);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            width: 100%;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #ffffff;
            color: var(--text);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(234, 68, 154, 0.2);
        }

        /* Disable Spin Buttons (Up/Down arrows) for Number Inputs */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Currency Input Styling */
        .currency-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #ffffff;
            overflow: hidden;
            width: 100%;
        }

        .currency-symbol {
            padding: 10px 12px;
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .currency-input-wrapper input {
            border: none;
            border-radius: 0;
            width: 100%;
            min-width: 0;
        }

        .currency-input-wrapper input:focus {
            box-shadow: none;
        }

        .currency-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(234, 68, 154, 0.2);
        }

        /* Phone Input Component */
        .phone-input-wrapper {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .country-select {
            width: 110px;
            flex-shrink: 0;
        }

        .phone-field {
            flex: 1;
            min-width: 0;
        }

        .total-display {
            background-color: #f1f5f9;
            padding: 14px 12px;
            border-radius: 6px;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: right;
            margin-top: 10px;
            grid-column: span 2;
            width: 100%;
        }

        .btn-submit {
            grid-column: span 2;
            background-color: #EA449A;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width, .total-display, .btn-submit, .form-group {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Invoice Data Input</h2>
    <form id="invoiceForm" onsubmit="handleSubmit(event)">
        <div class="form-grid">
            
            <!-- 1. Invoice Number -->
            <div class="form-group full-width">
                <label for="invoiceNumber">Invoice Number</label>
                <input type="text" id="invoiceNumber" placeholder="INV-2026-001" required>
            </div>

            <!-- 2. Additional Reference -->
            <div class="form-group full-width">
                <label for="additionalReference">Additional reference</label>
                <input type="text" id="additionalReference" placeholder="e.g. Student ID / Note">
            </div>

            <!-- 3. Your Email -->
            <div class="form-group full-width">
                <label for="userEmail">Your Email</label>
                <input type="email" id="userEmail" placeholder="user@example.com" required>
            </div>

            <!-- 4. Phone Number -->
            <div class="form-group full-width">
                <label for="phoneNumber">Phone Number</label>
                <div class="phone-input-wrapper">
                    <select id="countryCode" class="country-select">
                        <option value="+60">🇲🇾 +60</option>
                        <option value="+65">🇸🇬 +65</option>
                        <option value="+62">🇮🇩 +62</option>
                        <option value="+66">🇹🇭 +66</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                    </select>
                    <input 
                        type="tel" 
                        id="phoneNumber" 
                        class="phone-field" 
                        placeholder="123456789" 
                        inputmode="numeric" 
                        pattern="[0-9]*" 
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                        required>
                </div>
            </div>

            <!-- 5. Amount Input -->
            <div class="form-group full-width">
                <label for="amount">Amount</label>
                <div class="currency-input-wrapper">
                    <span class="currency-symbol">RM</span>
                    <input 
                        type="number" 
                        id="amount" 
                        step="0.01" 
                        min="0" 
                        placeholder="0.00" 
                        inputmode="decimal" 
                        oninput="updateTotal()" 
                        required>
                </div>
            </div>

            <!-- Total Amount Display -->
            <div class="total-display">
                Total Amount: RM <span id="calculatedTotal">0.00</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Review and Pay</button>
        </div>
    </form>
</div>

<script>
    function updateTotal() {
        const val = parseFloat(document.getElementById('amount').value) || 0;
        document.getElementById('calculatedTotal').innerText = val.toFixed(2);
    }

    function receiveUserDataFromAndroid(data) {
        if (!data) return;
        if (data.email) {
            document.getElementById('userEmail').value = data.email;
        }
        if (data.phone) {
            let cleanPhone = data.phone.trim();
            if (cleanPhone.startsWith('+')) {
                const select = document.getElementById('countryCode');
                for (let i = 0; i < select.options.length; i++) {
                    let code = select.options[i].value;
                    if (cleanPhone.startsWith(code)) {
                        select.value = code;
                        cleanPhone = cleanPhone.substring(code.length);
                        break;
                    }
                }
            }
            document.getElementById('phoneNumber').value = cleanPhone.replace(/[^0-9]/g, '');
        }
        if (data.countryCode) {
            document.getElementById('countryCode').value = data.countryCode;
        }
        if (data.additionalReference) {
            document.getElementById('additionalReference').value = data.additionalReference;
        }
    }

    function handleSubmit(event) {
        event.preventDefault();

        const form = document.getElementById('invoiceForm');
        const formElements = form.querySelectorAll('input, select, textarea');
        const formDataMap = {};

        // 1. Automatically grab every form element value using its ID or Name as key
        formElements.forEach(element => {
            if (element.type === 'submit' || element.type === 'button') return;
            const key = element.id || element.name;
            if (key) {
                formDataMap[key] = element.value;
            }
        });

        // 2. Add computed fields for convenience
        const rawAmount = parseFloat(document.getElementById('amount')?.value) || 0;
        const code = document.getElementById('countryCode')?.value || "";
        const localPhone = document.getElementById('phoneNumber')?.value || "";

        formDataMap['fullPhoneNumber'] = `${code}${localPhone}`;
        formDataMap['amountFormatted'] = rawAmount.toFixed(2);

        // 3. Post JSON string back to Android
        if (window.AndroidNative && window.AndroidNative.sendDataToAndroid) {
            window.AndroidNative.sendDataToAndroid(JSON.stringify(formDataMap));
        } else {
            console.log("Mapped Form Data:", formDataMap);
            alert("Form submitted! Check console for mapped data.");
        }
    }
</script>

</body>
</html>
