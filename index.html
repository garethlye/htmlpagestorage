<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Data Input</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        /* RM Currency Input Styling */
        .currency-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #ffffff;
            overflow: hidden;
        }

        .currency-symbol {
            padding: 10px 12px;
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
            border-right: 1px solid var(--border);
        }

        .currency-input-wrapper input {
            border: none;
            border-radius: 0;
            width: 100%;
        }

        .currency-input-wrapper input:focus {
            box-shadow: none;
        }

        .currency-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .total-display {
            background-color: #f1f5f9;
            padding: 14px 12px;
            border-radius: 6px;
            font-size: 1.15rem;
            font-weight: bold;
            text-align: right;
            margin-top: 10px;
            grid-column: span 2;
        }

        .btn-submit {
            grid-column: span 2;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width, .total-display, .btn-submit {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Invoice Data Input</h2>
    <form id="invoiceForm" onsubmit="handleSubmit(event)">
        <div class="form-grid">
            
            <!-- 1. Invoice Number -->
            <div class="form-group">
                <label for="invoiceNumber">Invoice Number</label>
                <input type="text" id="invoiceNumber" placeholder="INV-2026-001" required>
            </div>

            <!-- 2. Invoice Date -->
            <div class="form-group">
                <label for="invoiceDate">Invoice Date</label>
                <input type="date" id="invoiceDate" required>
            </div>

            <!-- 3. Your Email (Prefilled by Android, Editable) -->
            <div class="form-group full-width">
                <label for="userEmail">Your Email</label>
                <input type="email" id="userEmail" placeholder="user@example.com" required>
            </div>

            <!-- 4. Phone Number (Prefilled by Android, Editable) -->
            <div class="form-group full-width">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="+60 12-345 6789" required>
            </div>

            <!-- 5. Amount (Fixed RM prefix, 2 decimal places) -->
            <div class="form-group full-width">
                <label for="amount">Amount</label>
                <div class="currency-input-wrapper">
                    <span class="currency-symbol">RM</span>
                    <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" oninput="updateTotal()" required>
                </div>
            </div>

            <!-- Total Amount Display -->
            <div class="total-display">
                Total Amount: RM <span id="calculatedTotal">0.00</span>
            </div>

            <button type="submit" class="btn-submit">Submit Invoice Entry</button>
        </div>
    </form>
</div>

<script>
    // Set default date to today
    document.getElementById('invoiceDate').valueAsDate = new Date();

    // Updates the total display to mirror the Amount input
    function updateTotal() {
        const val = parseFloat(document.getElementById('amount').value) || 0;
        document.getElementById('calculatedTotal').innerText = val.toFixed(2);
    }

    // Function called directly from Android Kotlin/Java code
    function receiveUserDataFromAndroid(email, phone) {
        if (email) {
            document.getElementById('userEmail').value = email;
        }
        if (phone) {
            document.getElementById('phoneNumber').value = phone;
        }
    }

    function handleSubmit(event) {
        event.preventDefault();
        
        const rawAmount = parseFloat(document.getElementById('amount').value) || 0;

        const formData = {
            invoiceNumber: document.getElementById('invoiceNumber').value,
            invoiceDate: document.getElementById('invoiceDate').value,
            userEmail: document.getElementById('userEmail').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            amount: rawAmount.toFixed(2),
            totalAmount: rawAmount.toFixed(2)
        };

        console.log("Submitted Data:", formData);
        alert(`Invoice ${formData.invoiceNumber} submitted for RM ${formData.totalAmount}!`);
    }
</script>

</body>
</html>
